name: Previsions quotidiennes et site

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
      timezone: "Europe/Paris"

concurrency:
  group: scorepredict-daily
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Calculer les previsions
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SCOREPREDICT_BROWSER_HEADLESS: "0"
      SCOREPREDICT_BROWSER_CHANNEL: msedge
      SCOREPREDICT_BROWSER_ATTEMPTS: "3"
      SCOREPREDICT_BROWSER_FAILURE_DIR: inference/output/browser-failures
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pipeline.txt
            requirements-web.txt

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dependances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt -r requirements-web.txt
          npm ci

      - name: Verifier le code
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --check inference/sportytrader_page_text.mjs
          node --check production/static/assets/app.js

      - name: Calculer les 21 prochains jours
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          ./production/publish_dashboard.ps1 -PythonExe $pythonExe

      - name: Refuser une publication incomplete
        shell: pwsh
        run: |
          $dashboard = Get-Content -Raw production/static/data/dashboard.json | ConvertFrom-Json
          $expectedPortfolio = python -c "from inference.portfolio_presets import DEFAULT_PORTFOLIO_NAME; print(DEFAULT_PORTFOLIO_NAME)"
          if ($dashboard.meta.status -ne "ready") { throw "Le tableau de bord n'est pas pret." }
          if ($dashboard.predictions.Count -ne $dashboard.summary.upcomingBets) { throw "Le site contient des tendances non recommandees." }
          if (-not $dashboard.quality.teamRegistryReady) { throw "La liste des clubs est incomplete." }
          if ($dashboard.meta.activePortfolio -ne $expectedPortfolio) { throw "Le snapshot ne correspond pas au portefeuille de production." }
          if ($dashboard.quality.protocol.topExperiment -ne "draw_consensus_nonfavorite") { throw "L'audit ne reference pas le champion valide." }

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site valide
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/static

      - name: Conserver les diagnostics en cas d'echec
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: scorepredict-diagnostics-${{ github.run_id }}
          path: |
            inference/output/browser-failures
            inference/output/*.csv
            train/output/*.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publier le site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
