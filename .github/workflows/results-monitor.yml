name: Verification rapide des resultats

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 11-23 * * *"
      timezone: "Europe/Paris"
    - cron: "3,13,23,33,43,53 0-1 * * *"
      timezone: "Europe/Paris"

concurrency:
  group: scorepredict-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    name: Verifier les matchs termines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SCOREPREDICT_SCHEDULE_ATTEMPTS: "2"
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-results.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Installer les dependances legeres
        run: python -m pip install -r requirements-results.txt

      - name: Verifier le moniteur
        run: |
          python -m unittest tests.test_result_monitor tests.test_espn_results tests.test_sportytrader_client tests.test_prediction_window tests.test_terminal_result_immutability tests.test_pooled_release
          python -m py_compile inference/result_monitor.py

      - name: Verifier la memoire permanente
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL absent" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "SUPABASE_SECRET_KEY absent" && exit 1)

      - name: Conserver les donnees actuellement publiees
        run: |
          mkdir -p "${RUNNER_TEMP}/published-data"
          for name in dashboard explorer; do
            curl --fail --silent --show-error --retry 3 \
              "https://mohamed-ali-sobhi.github.io/ScorePredict/data/${name}.json?run=${GITHUB_RUN_ID}" \
              --output "${RUNNER_TEMP}/published-data/${name}.json"
            python -m json.tool "${RUNNER_TEMP}/published-data/${name}.json" > /dev/null
            cp "${RUNNER_TEMP}/published-data/${name}.json" "production/static/data/${name}.json"
          done

      - name: Recuperer les paris en attente
        run: |
          python -m inference.supabase_prediction_store pull \
            --ledger inference/output/live_portfolio_bet_log.csv \
            --portfolio "$(python -c 'from inference.portfolio_presets import LEGACY_PRODUCTION_PORTFOLIO_NAME; print(LEGACY_PRODUCTION_PORTFOLIO_NAME)')" \
            --status-output inference/output/prediction_store_status.json
          python -m inference.supabase_prediction_store pull \
            --ledger inference/output/live_portfolio_bet_log.csv \
            --portfolio "$(python -c 'from inference.portfolio_presets import DEFAULT_PORTFOLIO_NAME; print(DEFAULT_PORTFOLIO_NAME)')" \
            --status-output inference/output/prediction_store_status.json

      - name: Chercher uniquement les scores finaux
        id: result
        run: |
          python -m inference.result_monitor \
            --include-retired \
            --ledger inference/output/live_portfolio_bet_log.csv \
            --snapshot production/static/data/dashboard.json \
            --status-output inference/output/result_monitor_status.json
          changed=$(python -c "import json; print(str(json.load(open('inference/output/result_monitor_status.json'))['changed']).lower())")
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          cat inference/output/result_monitor_status.json

      - name: Regler le suivi prive sans publier ses decisions
        run: |
          python -m inference.private_observation pull
          python -m inference.private_observation settle
          node production/private_observation_crypto.cjs encrypt --input inference/output/private_observation/report.json --public-key production/observation_recipient.pem --output inference/output/private_observation/private-observation.encrypted.json

      - name: Conserver uniquement le suivi personnel chiffre
        uses: actions/upload-artifact@v5
        with:
          name: private-italy-epl-encrypted
          path: inference/output/private_observation/private-observation.encrypted.json
          if-no-files-found: error
          retention-days: 90

      - name: Enregistrer le resultat dans Supabase
        if: steps.result.outputs.changed == 'true'
        run: |
          python -m inference.supabase_prediction_store push \
            --ledger inference/output/live_portfolio_bet_log.csv \
            --portfolio "$(python -c 'from inference.portfolio_presets import LEGACY_PRODUCTION_PORTFOLIO_NAME; print(LEGACY_PRODUCTION_PORTFOLIO_NAME)')" \
            --status-output inference/output/prediction_store_status.json
          python -m inference.supabase_prediction_store push \
            --ledger inference/output/live_portfolio_bet_log.csv \
            --portfolio "$(python -c 'from inference.portfolio_presets import DEFAULT_PORTFOLIO_NAME; print(DEFAULT_PORTFOLIO_NAME)')" \
            --status-output inference/output/prediction_store_status.json


      - name: Verifier le perimetre public Bundesliga
        if: steps.result.outputs.changed == 'true'
        run: |
          python -m inference.publication_policy
          python -m inference.publication_policy --check

      - name: Preparer GitHub Pages
        if: steps.result.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Verifier la conservation de tous les matchs
        if: steps.result.outputs.changed == 'true'
        run: cmp "${RUNNER_TEMP}/published-data/explorer.json" production/static/data/explorer.json

      - name: Charger le site actualise
        if: steps.result.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: production/static

      - name: Conserver la provenance et le diagnostic des resultats
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: result-monitor-${{ github.run_id }}
          path: inference/output/result_monitor_status.json
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    name: Publier le resultat
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attendre le service d'authentification GitHub
        uses: actions/github-script@v8
        with:
          script: |
            for (let attempt = 1; attempt <= 3; attempt++) {
              try { await core.getIDToken(); break; }
              catch (error) {
                if (attempt === 3) throw error;
                core.warning(`Authentification temporairement indisponible, tentative ${attempt}/3.`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
